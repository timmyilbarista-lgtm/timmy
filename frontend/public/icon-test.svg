<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sfondo bianco -->
  <rect width="512" height="512" rx="100" fill="white"/>
  
  <!-- Ombra -->
  <ellipse cx="210" cy="420" rx="150" ry="22" fill="#D1D5DB" opacity="0.6"/>
  
  <!-- Corpo tazza cappuccino italiano - MOLTO bassa e larga -->
  <path d="M50 250 
           Q30 300 50 350 
           Q80 400 150 405 
           L290 405 
           Q360 400 390 350 
           Q410 300 390 250 
           Z" fill="#B5651D"/>
  
  <!-- Riflesso laterale -->
  <path d="M50 250 
           Q30 300 50 350 
           Q80 400 110 402 
           L110 255 
           Z" fill="#CD853F" opacity="0.5"/>
  
  <!-- Manico tazza cappuccino - piccolo e rotondo -->
  <path d="M390 280 Q440 285 440 330 Q440 375 390 375" stroke="#B5651D" stroke-width="28" fill="none" stroke-linecap="round"/>
  
  <!-- Riflesso manico -->
  <path d="M398 295 Q420 298 420 330 Q420 358 400 360" stroke="#CD853F" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Schiuma latte - azzurro, larga come la tazza -->
  <ellipse cx="220" cy="245" rx="170" ry="55" fill="#87CEEB"/>
  <circle cx="110" cy="215" r="45" fill="#87CEEB"/>
  <circle cx="220" cy="195" r="50" fill="#87CEEB"/>
  <circle cx="330" cy="210" r="45" fill="#87CEEB"/>
  <circle cx="165" cy="175" r="32" fill="#A7DFF0"/>
  <circle cx="275" cy="170" r="30" fill="#A7DFF0"/>
  <circle cx="220" cy="160" r="25" fill="#A7DFF0"/>
  
  <!-- Lettera B bianca al centro -->
  <text x="215" y="365" font-family="Arial, sans-serif" font-size="110" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
