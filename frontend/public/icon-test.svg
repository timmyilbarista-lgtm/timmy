<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sfondo bianco -->
  <rect width="512" height="512" rx="100" fill="white"/>
  
  <!-- Ombra sotto -->
  <ellipse cx="270" cy="415" rx="100" ry="15" fill="#D1D5DB" opacity="0.5"/>
  
  <!-- Tazza cappuccino - SPOSTATA A DESTRA -->
  <path d="M120 200 
           Q120 180 160 175
           L400 175
           Q440 180 440 200
           Q460 280 420 350
           Q380 400 270 400
           Q160 400 140 350
           Q100 280 120 200
           Z" fill="#B5651D"/>
  
  <!-- Riflesso sinistro -->
  <path d="M130 200 
           Q130 190 150 185
           L180 185
           Q150 250 160 320
           Q165 360 180 380
           L160 375
           Q120 350 115 300
           Q105 250 130 200
           Z" fill="#CD853F" opacity="0.4"/>
  
  <!-- Manico piccolissimo e attaccato -->
  <path d="M440 260 
           Q455 265 457 295
           Q459 325 448 340" 
           stroke="#B5651D" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Schiuma latte azzurra -->
  <ellipse cx="280" cy="185" rx="145" ry="40" fill="#87CEEB"/>
  <circle cx="180" cy="165" r="35" fill="#87CEEB"/>
  <circle cx="280" cy="150" r="42" fill="#87CEEB"/>
  <circle cx="370" cy="160" r="38" fill="#87CEEB"/>
  <circle cx="230" cy="135" r="28" fill="#A7DFF0"/>
  <circle cx="320" cy="130" r="25" fill="#A7DFF0"/>
  
  <!-- Lettera B bianca al centro -->
  <text x="275" y="330" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
