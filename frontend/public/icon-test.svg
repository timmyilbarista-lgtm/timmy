<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sfondo bianco -->
  <rect width="512" height="512" rx="100" fill="white"/>
  
  <!-- Ombra -->
  <ellipse cx="200" cy="410" rx="160" ry="20" fill="#D1D5DB" opacity="0.6"/>
  
  <!-- Corpo tazza cappuccino - BASSISSIMA e BOMBATA come ciotola -->
  <ellipse cx="200" cy="330" rx="175" ry="80" fill="#B5651D"/>
  
  <!-- Parte superiore tazza -->
  <ellipse cx="200" cy="270" rx="175" ry="50" fill="#B5651D"/>
  
  <!-- Riflesso laterale bombato -->
  <ellipse cx="90" cy="320" rx="30" ry="60" fill="#CD853F" opacity="0.4"/>
  
  <!-- Manico tazza - piccolo -->
  <path d="M375 290 Q430 300 430 340 Q430 380 375 380" stroke="#B5651D" stroke-width="26" fill="none" stroke-linecap="round"/>
  
  <!-- Schiuma latte - azzurro -->
  <ellipse cx="200" cy="265" rx="165" ry="45" fill="#87CEEB"/>
  <circle cx="100" cy="245" r="40" fill="#87CEEB"/>
  <circle cx="200" cy="225" r="50" fill="#87CEEB"/>
  <circle cx="300" cy="240" r="42" fill="#87CEEB"/>
  <circle cx="150" cy="210" r="30" fill="#A7DFF0"/>
  <circle cx="250" cy="205" r="28" fill="#A7DFF0"/>
  
  <!-- Lettera B bianca al centro -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="95" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
