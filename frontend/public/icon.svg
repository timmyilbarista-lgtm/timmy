<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sfondo bianco -->
  <rect width="512" height="512" rx="100" fill="white"/>
  
  <!-- Ombra sotto -->
  <ellipse cx="190" cy="415" rx="100" ry="15" fill="#D1D5DB" opacity="0.5"/>
  
  <!-- Tazza cappuccino italiano - bombata larga sopra, stretta sotto -->
  <path d="M40 200 
           Q40 180 80 175
           L320 175
           Q360 180 360 200
           Q380 280 340 350
           Q300 400 190 400
           Q80 400 60 350
           Q20 280 40 200
           Z" fill="#B5651D"/>
  
  <!-- Riflesso sinistro -->
  <path d="M50 200 
           Q50 190 70 185
           L100 185
           Q70 250 80 320
           Q85 360 100 380
           L80 375
           Q40 350 35 300
           Q25 250 50 200
           Z" fill="#CD853F" opacity="0.4"/>
  
  <!-- Manico elegante curvato -->
  <path d="M360 210 
           Q400 200 420 240
           Q440 290 420 340
           Q400 380 360 370" 
           stroke="#B5651D" stroke-width="22" fill="none" stroke-linecap="round"/>
  
  <!-- Riflesso manico -->
  <path d="M372 230 
           Q395 225 405 255
           Q415 290 405 325
           Q395 350 375 350" 
           stroke="#CD853F" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Schiuma latte azzurra -->
  <ellipse cx="200" cy="185" rx="145" ry="40" fill="#87CEEB"/>
  <circle cx="100" cy="165" r="35" fill="#87CEEB"/>
  <circle cx="200" cy="150" r="42" fill="#87CEEB"/>
  <circle cx="290" cy="160" r="38" fill="#87CEEB"/>
  <circle cx="150" cy="135" r="28" fill="#A7DFF0"/>
  <circle cx="240" cy="130" r="25" fill="#A7DFF0"/>
  
  <!-- Lettera B bianca al centro -->
  <text x="195" y="330" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
